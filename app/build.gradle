plugins {
    id 'com.android.application'
}

android {
    namespace 'com.r4d01.piconnect'
    compileSdk 34

    defaultConfig {
        applicationId "com.r4d01.piconnect"
        minSdk 21
        targetSdk 34
        versionCode 3
        versionName "1.2"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
